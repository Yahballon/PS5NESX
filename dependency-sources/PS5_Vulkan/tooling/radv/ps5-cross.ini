# PS5 Vulkan - meson cross file for building Mesa (RADV) for the console.
# Copyright (C) 2026 Mihawk-99
# SPDX-License-Identifier: GPL-3.0-or-later
#
# The payload SDK's own file (toolchain/prospero.ini) names the console as the
# target machine, which meson reads as a compiler's target; a library built to
# run on the console needs it as the host machine, or meson configures for the
# build machine's system. The SDK root is passed as a constant by
# tools/build-radv.sh (--cross-file this --cross-file its generated
# constants file).

[binaries]
c = sdk / 'bin/prospero-clang'
cpp = sdk / 'bin/prospero-clang++'
ar = sdk / 'bin/prospero-ar'
strip = sdk / 'bin/prospero-strip'
pkg-config = sdk / 'bin/prospero-pkg-config'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
default_library = 'static'

[properties]
needs_exe_wrapper = true
